{% extends "base.html" %}
{% load static %}

{% block title %}Login – AstraLink{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-white/5 backdrop-blur-xl 
                border border-white/10 rounded-xl p-8 shadow-xl">

        <h1 class="text-2xl font-orbitron text-cyan-400 text-center mb-6">
            Welcome Back 🚀
        </h1>

        {% if messages %}
    {% for message in messages %}
        <p class="text-red-400 text-sm mb-4 text-center">
            {{ message }}
        </p>
    {% endfor %}
{% endif %}


        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm text-slate-300 mb-1">Username</label>
                <input type="text" name="username"
                       class="w-full px-3 py-2 rounded-lg bg-black/30 text-white
                              border border-white/10 focus:border-cyan-400 
                              focus:ring-0 outline-none transition"
                       required>
            </div>

            <div>
                <label class="block text-sm text-slate-300 mb-1">Password</label>
                <input type="password" name="password"
                       class="w-full px-3 py-2 rounded-lg bg-black/30 text-white
                              border border-white/10 focus:border-cyan-400 
                              focus:ring-0 outline-none transition"
                       required>
            </div>

            <button type="submit"
                    class="w-full mt-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-700 
                           text-white font-medium transition">
                Log In
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-5">
            No account yet?
            <a href="{% url 'register' %}" class="text-cyan-400 hover:underline">
                Create one
            </a>
        </p>

    </div>
</div>

{% endblock %}
