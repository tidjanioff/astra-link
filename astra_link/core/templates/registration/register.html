{% extends "base.html" %}

{% block title %}Register – AstraLink{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white/5 p-6 rounded-xl backdrop-blur border border-white/10">

    <h1 class="text-2xl font-orbitron text-cyan-400 mb-4">Create Account</h1>

    {% if messages %}
        {% for message in messages %}
            <p class="text-red-400 text-sm mb-3">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-gray-300 text-sm mb-1">Username</label>
            <input name="username" type="text" required
                   class="w-full px-3 py-2 rounded bg-white/10 text-white border border-white/20">
        </div>

        <div>
            <label class="block text-gray-300 text-sm mb-1">Password</label>
            <input name="password" type="password" required
                   class="w-full px-3 py-2 rounded bg-white/10 text-white border border-white/20">
        </div>

        <div>
            <label class="block text-gray-300 text-sm mb-1">Confirm Password</label>
            <input name="confirm" type="password" required
                   class="w-full px-3 py-2 rounded bg-white/10 text-white border border-white/20">
        </div>

        <button class="w-full py-2 bg-cyan-600 hover:bg-cyan-700 
                       rounded-lg text-white font-semibold transition">
            Register
        </button>
    </form>

    <p class="text-gray-400 text-sm mt-4">
        Already have an account?
        <a href="{% url 'login' %}" class="text-cyan-300 underline">Login</a>
    </p>
</div>
{% endblock %}
