{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AstraLink{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    
    <script src="{% static 'script.js' %}"></script>

</head>
<body class="min-h-screen">

    <nav class="p-4 bg-black/30 backdrop-blur-sm flex items-center justify-between">
    <a href="{% url 'index' %}" class="flex items-center space-x-2">
        
        <img src="{% static 'img/astralink.png' %}" 
             alt="AstraLink Logo"
             class="h-8 w-auto select-none">

        <span id="logo-title" class="title-font text-xl text-cyan-400">
            AstraLink
        </span>

    </a>


        <div class="flex items-center space-x-4">

            {% if user.is_authenticated %}
                <a href="{% url 'my_launches' %}" class="text-white font-bold hover:text-cyan-400">My Launches</a>
                <a href="/logout/" class="flex items-center text-white hover:text-cyan-400 gap-1">
    Logout
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" 
         viewBox="0 0 24 24" 
         stroke-width="1.5" 
         stroke="currentColor" 
         class="w-5 h-5">
      <path stroke-linecap="round" 
            stroke-linejoin="round" 
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H3" />
    </svg>
</a>

            {% else %}
      <a href="/login/" class="flex items-center font-bold gap-2 text-white hover:text-cyan-400">
    Login
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" 
         viewBox="0 0 24 24" 
         stroke-width="1.5" 
         stroke="currentColor" 
         class="w-5 h-5">
      <path stroke-linecap="round" 
            stroke-linejoin="round" 
            d="M12 15l3-3m0 0l-3-3m3 3H3m12 6V6a3 3 0 013-3h3" />
    </svg>
</a>


            {% endif %}

        </div>
    </nav>

    <main class="p-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="mt-16 mb-4 text-center">
    <p class="text-[13px] text-gray-400">
       &copy; 2026 AstraLink | Built by Tidjani.<br/> All rights reserved.
    </p>
</footer>


</body>
</html>
