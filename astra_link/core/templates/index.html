{% extends "base.html" %}

{% block title %}Upcoming Launches – AstraLink{% endblock %}

{% block content %}
<h1 class="text-2xl title-font text-cyan-400 mb-4">Upcoming Launches</h1>

<div class="space-y-2">

    {% for launch in launches %}
        <a href="{% url 'launch_detail' launch.id %}"
           class="block p-4 bg-white/5 rounded-lg hover:bg-white/10 transition">

            <p class="text-lg font-semibold">{{ launch.name }}</p>
            <p class="text-sm text-gray-400">{{ launch.net }}</p>

        </a>
    {% endfor %}

</div>
{% endblock %}
